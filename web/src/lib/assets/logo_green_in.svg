<style>
/* The bars travel along their own slant (-0.2868 x per 1 y), so they read as being drawn
   rather than sliding sideways. 100 y units is the full bar height, which parks them
   outside the viewBox at the start.
   Class, keyframe and gradient names carry the colour and direction so several of these
   SVGs can be inlined into one document without their style blocks colliding. */
.wb-green-in-bar { animation: wb-green-in 620ms cubic-bezier(0.16, 0.84, 0.32, 1) both; }
.wb-green-in-bar-2 { animation-delay: 80ms; }
.wb-green-in-bar-3 { animation-delay: 160ms; }
@keyframes wb-green-in {
from { opacity: 0; transform: translate(-28.68px, 100px); }
to { opacity: 1; transform: translate(0, 0); }
}
@media (prefers-reduced-motion: reduce) {
.wb-green-in-bar { animation: wb-green-in-reduced 200ms linear both; animation-delay: 0s; }
@keyframes wb-green-in-reduced { from { opacity: 0; } to { opacity: 1; } }
}
</style>
