<svg width="133" height="133" viewBox="0 0 133 133" fill="none" xmlns="http://www.w3.org/2000/svg">
<title>Werkbank logo, disappearing downwards</title>
<defs>
<linearGradient id="wb_blue_out_down_gradient" gradientUnits="userSpaceOnUse" x1="28.6663" y1="0" x2="104" y2="99.9712">
<stop stop-color="#6685C5"/>
<stop offset="1" stop-color="#32405F"/>
</linearGradient>
</defs>
<style>
/* Leaves the way the "in" animation entered: down the slant, off the bottom left. The
   stagger runs right-to-left so it does not look like the entry played backwards. */
.wb-blue-out-down-bar { animation: wb-blue-out-down 520ms cubic-bezier(0.55, 0, 0.85, 0.35) both; }
.wb-blue-out-down-bar-2 { animation-delay: 80ms; }
.wb-blue-out-down-bar-1 { animation-delay: 160ms; }
@keyframes wb-blue-out-down {
from { opacity: 1; transform: translate(0, 0); }
/* opacity runs ahead of the movement so the round caps are already faint by the time the
   viewBox clips them square at the edge */
55% { opacity: 0.15; }
to { opacity: 0; transform: translate(-28.68px, 100px); }
}
@media (prefers-reduced-motion: reduce) {
.wb-blue-out-down-bar { animation: wb-blue-out-down-reduced 200ms linear both; animation-delay: 0s; }
@keyframes wb-blue-out-down-reduced { from { opacity: 1; } to { opacity: 0; } }
}
</style>
<g transform="translate(0.167 16.514)">
