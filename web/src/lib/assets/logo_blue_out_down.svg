<path class="wb-blue-out-down-bar wb-blue-out-down-bar-2" d="M66.6663 0V0C82.1303 0 91.2109 12.0504 86.9484 26.9153L66 99.9712V99.9712C50.536 99.9712 41.4554 87.9208 45.7178 73.0559L66.6663 0Z" fill="url(#wb_blue_out_down_gradient)"/>
<path class="wb-blue-out-down-bar wb-blue-out-down-bar-3" d="M104.666 0V0C120.13 0 129.211 12.0504 124.948 26.9153L104 99.9712V99.9712C88.536 99.9712 79.4554 87.9208 83.7178 73.0559L104.666 0Z" fill="url(#wb_blue_out_down_gradient)"/>
</g>
</svg>
